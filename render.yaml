services:
  - type: web
    name: alvo-leiloes-backend
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_BEARER_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
