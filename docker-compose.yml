services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alvo
      POSTGRES_PASSWORD: alvo
      POSTGRES_DB: alvo_leiloes
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alvo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
